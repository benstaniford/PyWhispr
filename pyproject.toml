[project]
name = "pywhispr"
version = "0.2.12"
description = "Local, hotkey-driven voice dictation using open source speech-to-text models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5",
    "pynput>=1.8",
    "PySide6>=6.8",
    "platformdirs>=4",
    "tomli-w>=1",
    "huggingface-hub>=0.30",
    # Verify TLS against the OS trust store so model downloads survive
    # corporate TLS inspection (see pywhispr/certs.py).
    "truststore>=0.10",
    # STT backends, gated per platform
    "quickmachotkey>=2025.7 ; sys_platform == 'darwin'",
    "parakeet-mlx>=0.5 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "onnx-asr[hub]>=0.12 ; sys_platform != 'darwin'",
    "onnxruntime-gpu>=1.22 ; sys_platform == 'win32' or sys_platform == 'linux'",
    # Per-application session volumes, for ducking other apps while recording
    # (see ducking.py).
    "pycaw>=20240210 ; sys_platform == 'win32'",
]

[project.scripts]
pywhispr = "pywhispr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[tool.uv]
# Without this, resolution backtracks numba to ancient versions that fail to build
# (numba caps numpy, so numpy must be resolved down rather than numba down).
constraint-dependencies = ["numba>=0.61"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: tests that download and run the real STT model (deselect with '-m \"not model\"')",
]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# Blind `except Exception` is deliberate at thread boundaries (worker/callback
# threads must never die silently), so BLE is not enabled.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pywhispr"]
