name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-app:
    name: Build macOS app (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Build app bundle
        run: uv run --with pyinstaller pyinstaller packaging/pywhispr.spec --noconfirm

      - name: Zip app bundle
        # ditto preserves symlinks, resource forks and the code signature
        run: ditto -c -k --keepParent dist/PyWhispr.app dist/PyWhispr-${{ github.ref_name }}-macos-arm64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/PyWhispr-${{ github.ref_name }}-macos-arm64.zip

  macos-app-lite:
    name: Build macOS Lite app (x86_64, Ventura)
    # macos-13 is the last Intel runner (macos-14+ are Apple Silicon), and it runs
    # Ventura — so the binary is built against the Ventura SDK it must run on.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Build Lite app bundle
        run: uv run --with pyinstaller pyinstaller packaging/pywhispr_lite.spec --noconfirm

      - name: Zip app bundle
        # ditto preserves symlinks, resource forks and the code signature
        run: ditto -c -k --keepParent dist/PyWhisprLite.app dist/PyWhisprLite-${{ github.ref_name }}-macos-x86_64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-lite
          path: dist/PyWhisprLite-${{ github.ref_name }}-macos-x86_64.zip

  windows-msi:
    name: Build Windows MSI (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Build MSI
        run: uv run --with cx_Freeze python packaging/setup_msi.py bdist_msi

      - name: Rename MSI
        shell: bash
        run: mv dist/*.msi dist/PyWhispr-${{ github.ref_name }}-windows-x64.msi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/PyWhispr-${{ github.ref_name }}-windows-x64.msi

  release:
    name: Publish release
    needs: [macos-app, macos-app-lite, windows-msi]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A single gh-release call publishes both assets, avoiding the race that
      # occurs when parallel build jobs each create/update the same release.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
